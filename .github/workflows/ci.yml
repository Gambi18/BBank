name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cheap gates only. Test and coverage gates arrive with WI-29 (Phase 1).
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The layered structure stops being layered within a month if nothing
      # enforces it. Verified non-vacuous: adding a domain -> store import fails.
      - name: architecture (dependency rule, TRD 4.2)
        run: ./archcheck.sh

      # -short skips the testcontainers integration tests; they get their own
      # job below so a Docker problem is distinguishable from a logic failure.
      - name: unit tests
        run: go test ./... -race -short

      # sqlc output is generated, so a stale checkout means the code and the
      # queries have silently diverged.
      - name: sqlc generate is up to date
        run: |
          curl -sSL https://downloads.sqlc.dev/sqlc_1.31.1_linux_amd64.tar.gz | tar xz -C /tmp
          /tmp/sqlc generate
          if ! git diff --quiet -- internal/store; then
            echo "::error::internal/store is stale — run 'sqlc generate' and commit"
            git diff --stat -- internal/store
            exit 1
          fi

  # Integration tests + coverage gates (WI-29). Separate from the unit job so a
  # Docker or container-pull problem reads as an infrastructure failure rather
  # than as broken code — and so the fast gates still report when this is slow.
  backend-integration:
    name: Backend integration & coverage (WI-29)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Pull once, up front: the first testcontainers call would otherwise
      # absorb the pull time and look like a slow test.
      - name: Pre-pull postgres image
        run: docker pull postgres:18

      # Runs the real schema against real PostgreSQL 18 through testcontainers:
      # row locks, partial unique indexes, enum types and CHECK constraints are
      # half of what this system relies on, and none of them exist in a mock.
      - name: Integration tests
        run: go test ./... -race
        env:
          CI: "true"

      # domain >= 90%, service >= 70% (IMPLEMENTATION_PLAN §4.1).
      # Verified non-vacuous: raising a threshold above actual coverage exits 1.
      - name: Coverage gates
        run: ./coverage.sh
        env:
          CI: "true"

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bbank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bbank/package-lock.json

      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  migrations:
    name: Migrations up / down / up
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install golang-migrate
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz \
            | tar xvz -C /tmp migrate
          sudo mv /tmp/migrate /usr/local/bin/
      # A migration that cannot be rolled back is not a migration (WI-08).
      - name: up -> down -> up
        env:
          DB: postgres://ci:ci@localhost:5432/ci?sslmode=disable
        run: |
          migrate -path backend/migrations -database "$DB" up
          migrate -path backend/migrations -database "$DB" down -all
          migrate -path backend/migrations -database "$DB" up

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-credentials-in-logs:
    name: No credential logged at boot (WI-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Asserts the specific regression WI-01 fixed: the DSN, password included,
      # was printed to stdout on every boot.
      - name: Assert no raw DSN is printed
        run: |
          # Flag any print/log call that passes a DSN-bearing identifier without
          # routing it through safeDSN(). safeDSN's own definition is exempt.
          if grep -rnE '(fmt\.(Print|Printf|Println|Fprint[a-z]*)|log\.[A-Z][a-z]+|logger\.(Info|Warn|Error|Debug)|slog\.[A-Z][a-z]+)\(.*(dsn|databaseURL|DATABASE_URL)' backend/*.go \
             | grep -v 'safeDSN(' ; then
            echo "::error::A raw DSN appears to be logged. Route it through safeDSN()."; exit 1
          fi
          echo "OK: no raw DSN logging found"
