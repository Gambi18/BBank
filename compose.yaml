# Values come from `.env` in this directory (see .env.example). The `:?` syntax makes
# compose fail with a named error rather than starting with a default credential (WI-07).

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required — copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required — copy .env.example to .env}
    ports:
      # Host port is configurable: 5433 collides with other local Postgres
      # containers on some machines. Container-internal port is always 5432,
      # which is what DATABASE_URL uses over the compose network.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # -d is required: without it pg_isready defaults dbname to the username and
      # Postgres logs FATAL: database "admin" does not exist every interval.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # WI-08: schema is applied here, once, before the API starts. The API no longer
  # executes DDL. Runs to completion and exits; `goapp` waits on that exit code.
  migrate:
    image: migrate/migrate:v4.17.1
    restart: "no"
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL:?DATABASE_URL is required — copy .env.example to .env}"
      - "up"
    depends_on:
      db:
        condition: service_healthy

  goapp:
    container_name: goapp
    image: goapp:1.0.0
    build:
      context: ./backend
      dockerfile: go.dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required — copy .env.example to .env}
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # WI-03: exact origins only. Never "*".
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # WI-17: ES256 signing key. No default — the API refuses to start without it.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required — see .env.example}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.bbank.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bbank-web}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    container_name: bbank
    image: bbank:1.0.0
    build:
      context: ./bbank
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Server components/actions call the Go API over the compose network, not localhost.
      API_BASE_URL: ${API_BASE_URL:-http://goapp:8000}
    ports:
      - "3000:3000"
    depends_on:
      goapp:
        condition: service_started

volumes:
  postgres_data:
